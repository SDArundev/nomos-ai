<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOMOS AI - Feature Dependency Graph</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f;
    color: #e0e0e8;
    overflow: hidden;
    height: 100vh;
  }

  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(10, 10, 15, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  #header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  #header h1 span { color: #7c6aef; }

  .stats {
    display: flex;
    gap: 12px;
    font-size: 11px;
    font-weight: 500;
  }

  .stat {
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
  }

  .stat .count { font-weight: 700; margin-right: 4px; }

  #controls {
    position: fixed;
    top: 56px; left: 0;
    z-index: 100;
    background: rgba(10, 10, 15, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    width: 100%;
  }

  .filter-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .filter-group label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #888;
    margin-right: 2px;
  }

  .chip {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    color: #aaa;
    transition: all 0.15s;
    user-select: none;
    white-space: nowrap;
  }

  .chip:hover { background: rgba(255,255,255,0.08); color: #ddd; }
  .chip.active { background: rgba(124,106,239,0.15); border-color: rgba(124,106,239,0.4); color: #c4b8ff; }

  .sep {
    width: 1px;
    height: 24px;
    background: rgba(255,255,255,0.08);
    margin: 0 6px;
  }

  #graph { width: 100%; height: 100vh; }

  #tooltip {
    position: fixed;
    pointer-events: none;
    z-index: 200;
    background: rgba(18, 18, 28, 0.96);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 12px;
    max-width: 340px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    display: none;
  }

  .tt-id {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  .tt-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .tt-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tt-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }

  .tt-deps {
    margin-top: 8px;
    font-size: 11px;
    color: #999;
    line-height: 1.4;
  }

  .tt-deps strong {
    color: #bbb;
  }

  #legend {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 100;
    background: rgba(18, 18, 28, 0.92);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 16px;
    font-size: 11px;
  }

  #legend h3 {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #888;
    margin-bottom: 10px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
  }

  .legend-circle {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .legend-line {
    width: 20px;
    height: 2px;
    flex-shrink: 0;
  }

  #zoom-controls {
    position: fixed;
    bottom: 16px;
    left: 16px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  #zoom-controls button {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(18, 18, 28, 0.92);
    color: #ccc;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(12px);
  }

  #zoom-controls button:hover { background: rgba(255,255,255,0.1); }

  #search {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: #e0e0e8;
    font-size: 12px;
    width: 180px;
    outline: none;
  }

  #search:focus { border-color: rgba(124,106,239,0.5); }
  #search::placeholder { color: #555; }
</style>
</head>
<body>

<div id="header">
  <h1><span>NOMOS</span> Feature Dependency Graph</h1>
  <div class="stats" id="stats"></div>
  <input type="text" id="search" placeholder="Search features..." />
</div>

<div id="controls">
  <div class="filter-group">
    <label>Status</label>
    <div id="status-filters" style="display:flex;gap:4px;"></div>
  </div>
  <div class="sep"></div>
  <div class="filter-group">
    <label>Category</label>
    <div id="cat-filters" style="display:flex;gap:4px;flex-wrap:wrap;"></div>
  </div>
</div>

<svg id="graph"></svg>

<div id="tooltip"></div>

<div id="legend">
  <h3>Status</h3>
  <div class="legend-item"><div class="legend-circle" style="background:#22c55e"></div> Verified</div>
  <div class="legend-item"><div class="legend-circle" style="background:#3b82f6"></div> In Progress</div>
  <div class="legend-item"><div class="legend-circle" style="background:#f59e0b"></div> Pending</div>
  <div class="legend-item"><div class="legend-circle" style="background:#6b7280"></div> Backlog</div>
  <h3 style="margin-top:12px">Edges</h3>
  <div class="legend-item"><div class="legend-line" style="background:#7c6aef"></div> Dependency</div>
  <div class="legend-item"><div class="legend-line" style="background:#f97316"></div> Highlighted path</div>
  <h3 style="margin-top:12px">Size = dependents count</h3>
</div>

<div id="zoom-controls">
  <button onclick="zoomIn()">+</button>
  <button onclick="zoomOut()">&minus;</button>
  <button onclick="zoomReset()">&#8634;</button>
</div>

const categoryColors = {
  'CAT-PRJ': '#8b5cf6', 'CAT-KAN': '#06b6d4', 'CAT-AGT': '#f43f5e',
  'CAT-AUT': '#f97316', 'CAT-GIT': '#10b981', 'CAT-TRM': '#84cc16',
  'CAT-GHB': '#6366f1', 'CAT-THM': '#ec4899', 'CAT-DXP': '#14b8a6',
  'CAT-SEC': '#ef4444', 'CAT-CFG': '#a78bfa', 'CAT-NTF': '#fbbf24',
  'CAT-SPC': '#2dd4bf', 'CAT-MEM': '#c084fc', 'CAT-DEP': '#fb923c',
  'CAT-DSK': '#38bdf8', 'CAT-API': '#4ade80', 'CAT-DBS': '#60a5fa',
  'CAT-TST': '#facc15', 'CAT-OBS': '#f472b6',
  'CAT-FIX': '#ff6b6b', 'CAT-ENH': '#a3e635'
};

const statusColors = {
  verified: '#22c55e',
  in_progress: '#3b82f6',
  pending: '#f59e0b',
  backlog: '#6b7280',
  failed: '#ef4444'
};

const catMap = {};
DATA.categories.forEach(c => catMap[c.id] = c.name);
catMap['CAT-FIX'] = 'Bug Fixes';
catMap['CAT-ENH'] = 'Enhancements';

// Build graph data
const featureMap = {};
DATA.features.forEach(f => featureMap[f.id] = f);

const nodes = DATA.features.map(f => ({
  id: f.id,
  title: f.title,
  status: f.status,
  category: f.category,
  priority: f.priority,
  deps: f.dependencies || [],
  depCount: 0,
  dependents: []
}));

const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);

const links = [];
DATA.features.forEach(f => {
  (f.dependencies || []).forEach(depId => {
    if (nodeMap[depId]) {
      links.push({ source: depId, target: f.id });
      nodeMap[f.id].depCount++;
      nodeMap[depId].dependents.push(f.id);
    }
  });
});

// Stats - build with safe DOM methods
const statusCounts = {};
nodes.forEach(n => { statusCounts[n.status] = (statusCounts[n.status] || 0) + 1; });
const catCounts = {};
nodes.forEach(n => { catCounts[n.category] = (catCounts[n.category] || 0) + 1; });

const statsEl = document.getElementById('stats');
Object.entries(statusCounts).sort((a,b) => b[1] - a[1]).forEach(([s, c]) => {
  const div = document.createElement('div');
  div.className = 'stat';
  const countSpan = document.createElement('span');
  countSpan.className = 'count';
  countSpan.style.color = statusColors[s];
  countSpan.textContent = c;
  div.appendChild(countSpan);
  div.appendChild(document.createTextNode(s.replace('_', ' ')));
  statsEl.appendChild(div);
});

// Filters
let activeStatuses = new Set(['verified', 'in_progress', 'pending', 'backlog', 'failed']);
let activeCategories = new Set(Object.keys(catMap));
let searchTerm = '';
let selectedNode = null;

const statusDiv = document.getElementById('status-filters');
Object.entries(statusCounts).sort((a,b) => b[1] - a[1]).forEach(([s, c]) => {
  const chip = document.createElement('div');
  chip.className = 'chip active';
  chip.textContent = s.replace('_', ' ') + ' (' + c + ')';
  chip.dataset.status = s;
  chip.onclick = () => toggleStatus(s, chip);
  statusDiv.appendChild(chip);
});

const catDiv = document.getElementById('cat-filters');
Object.entries(catCounts).sort((a,b) => b[1] - a[1]).forEach(([cat, c]) => {
  const chip = document.createElement('div');
  chip.className = 'chip active';
  chip.style.borderLeftWidth = '3px';
  chip.style.borderLeftColor = categoryColors[cat] || '#666';
  chip.textContent = (catMap[cat] || cat) + ' (' + c + ')';
  chip.dataset.cat = cat;
  chip.onclick = () => toggleCategory(cat, chip);
  catDiv.appendChild(chip);
});

function toggleStatus(s, chip) {
  if (activeStatuses.has(s)) { activeStatuses.delete(s); chip.classList.remove('active'); }
  else { activeStatuses.add(s); chip.classList.add('active'); }
  updateVisibility();
}

function toggleCategory(cat, chip) {
  if (activeCategories.has(cat)) { activeCategories.delete(cat); chip.classList.remove('active'); }
  else { activeCategories.add(cat); chip.classList.add('active'); }
  updateVisibility();
}

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase();
  updateVisibility();
});

// SVG setup
const width = window.innerWidth;
const height = window.innerHeight;

const svg = d3.select('#graph')
  .attr('width', width)
  .attr('height', height);

const defs = svg.append('defs');
defs.append('marker')
  .attr('id', 'arrow')
  .attr('viewBox', '0 0 10 6')
  .attr('refX', 10)
  .attr('refY', 3)
  .attr('markerWidth', 8)
  .attr('markerHeight', 5)
  .attr('orient', 'auto')
  .append('path')
  .attr('d', 'M0,0 L10,3 L0,6 L3,3 Z')
  .attr('fill', 'rgba(124,106,239,0.3)');

defs.append('marker')
  .attr('id', 'arrow-hl')
  .attr('viewBox', '0 0 10 6')
  .attr('refX', 10)
  .attr('refY', 3)
  .attr('markerWidth', 8)
  .attr('markerHeight', 5)
  .attr('orient', 'auto')
  .append('path')
  .attr('d', 'M0,0 L10,3 L0,6 L3,3 Z')
  .attr('fill', '#f97316');

const g = svg.append('g');

const zoom = d3.zoom()
  .scaleExtent([0.1, 5])
  .on('zoom', e => g.attr('transform', e.transform));

svg.call(zoom);

function zoomIn() { svg.transition().duration(300).call(zoom.scaleBy, 1.5); }
function zoomOut() { svg.transition().duration(300).call(zoom.scaleBy, 0.67); }
function zoomReset() { svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(width/2, height/2).scale(0.5)); }

// Force simulation
const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(60).strength(0.3))
  .force('charge', d3.forceManyBody().strength(-120).distanceMax(400))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(d => getRadius(d) + 4))
  .force('x', d3.forceX(width / 2).strength(0.03))
  .force('y', d3.forceY(height / 2).strength(0.03));

// Group clustering force by category
const catCenters = {};
const catKeys = Object.keys(catMap);
catKeys.forEach((cat, i) => {
  const angle = (2 * Math.PI * i) / catKeys.length;
  catCenters[cat] = {
    x: width/2 + Math.cos(angle) * 300,
    y: height/2 + Math.sin(angle) * 300
  };
});

simulation.force('cluster', alpha => {
  nodes.forEach(d => {
    const c = catCenters[d.category];
    if (c) {
      d.vx += (c.x - d.x) * alpha * 0.04;
      d.vy += (c.y - d.y) * alpha * 0.04;
    }
  });
});

function getRadius(d) {
  const base = 4;
  const depBonus = Math.min(d.dependents.length * 1.2, 10);
  return base + depBonus;
}

// Draw elements
const linkGroup = g.append('g').attr('class', 'links');
const nodeGroup = g.append('g').attr('class', 'nodes');
const labelGroup = g.append('g').attr('class', 'labels');

const linkElements = linkGroup.selectAll('line')
  .data(links)
  .join('line')
  .attr('stroke', 'rgba(124,106,239,0.12)')
  .attr('stroke-width', 1)
  .attr('marker-end', 'url(#arrow)');

const nodeElements = nodeGroup.selectAll('circle')
  .data(nodes)
  .join('circle')
  .attr('r', d => getRadius(d))
  .attr('fill', d => statusColors[d.status] || '#666')
  .attr('stroke', d => categoryColors[d.category] || '#444')
  .attr('stroke-width', 1.5)
  .attr('cursor', 'pointer')
  .on('mouseover', onNodeHover)
  .on('mouseout', onNodeOut)
  .on('click', onNodeClick)
  .call(d3.drag()
    .on('start', dragStarted)
    .on('drag', dragged)
    .on('end', dragEnded));

const labelElements = labelGroup.selectAll('text')
  .data(nodes)
  .join('text')
  .text(d => d.id)
  .attr('font-size', d => d.dependents.length > 3 ? 9 : 7)
  .attr('fill', '#999')
  .attr('text-anchor', 'middle')
  .attr('dy', d => -getRadius(d) - 3)
  .attr('pointer-events', 'none')
  .attr('font-family', 'monospace')
  .attr('font-weight', d => d.dependents.length > 5 ? 700 : 400);

simulation.on('tick', () => {
  linkElements
    .attr('x1', d => d.source.x)
    .attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x)
    .attr('y2', d => d.target.y);

  nodeElements.attr('cx', d => d.x).attr('cy', d => d.y);
  labelElements.attr('x', d => d.x).attr('y', d => d.y);
});

// Tooltip - safe DOM construction
const tooltip = document.getElementById('tooltip');

function buildTooltip(d) {
  tooltip.replaceChildren();

  const idDiv = document.createElement('div');
  idDiv.className = 'tt-id';
  idDiv.style.color = categoryColors[d.category] || '#888';
  idDiv.textContent = d.id + ' \u00b7 ' + (catMap[d.category] || d.category);
  tooltip.appendChild(idDiv);

  const titleDiv = document.createElement('div');
  titleDiv.className = 'tt-title';
  titleDiv.textContent = d.title;
  tooltip.appendChild(titleDiv);

  const metaDiv = document.createElement('div');
  metaDiv.className = 'tt-meta';

  const statusBadge = document.createElement('span');
  statusBadge.className = 'tt-badge';
  statusBadge.style.background = (statusColors[d.status] || '#666') + '22';
  statusBadge.style.color = statusColors[d.status] || '#666';
  statusBadge.textContent = d.status.replace('_', ' ');
  metaDiv.appendChild(statusBadge);

  const prioBadge = document.createElement('span');
  prioBadge.className = 'tt-badge';
  prioBadge.style.background = 'rgba(255,255,255,0.06)';
  prioBadge.style.color = '#aaa';
  prioBadge.textContent = 'P' + d.priority;
  metaDiv.appendChild(prioBadge);

  tooltip.appendChild(metaDiv);

  if (d.deps.length > 0) {
    const depsDiv = document.createElement('div');
    depsDiv.className = 'tt-deps';
    const strong1 = document.createElement('strong');
    strong1.textContent = 'Depends on:';
    depsDiv.appendChild(strong1);
    d.deps.forEach(id => {
      depsDiv.appendChild(document.createElement('br'));
      const f = nodeMap[id];
      depsDiv.appendChild(document.createTextNode(f ? id + ': ' + f.title : id));
    });
    tooltip.appendChild(depsDiv);
  }

  if (d.dependents.length > 0) {
    const depsDiv = document.createElement('div');
    depsDiv.className = 'tt-deps';
    const strong2 = document.createElement('strong');
    strong2.textContent = 'Depended by (' + d.dependents.length + '):';
    depsDiv.appendChild(strong2);
    const show = d.dependents.slice(0, 8);
    show.forEach(id => {
      depsDiv.appendChild(document.createElement('br'));
      const f = nodeMap[id];
      depsDiv.appendChild(document.createTextNode(f ? id + ': ' + f.title : id));
    });
    if (d.dependents.length > 8) {
      depsDiv.appendChild(document.createElement('br'));
      depsDiv.appendChild(document.createTextNode('... and ' + (d.dependents.length - 8) + ' more'));
    }
    tooltip.appendChild(depsDiv);
  }
}

function onNodeHover(event, d) {
  buildTooltip(d);
  tooltip.style.display = 'block';

  const x = event.clientX + 16;
  const y = event.clientY - 10;
  tooltip.style.left = (x + 340 > width ? x - 360 : x) + 'px';
  tooltip.style.top = Math.min(y, height - 300) + 'px';

  if (!selectedNode) highlightConnections(d);
}

function onNodeOut() {
  tooltip.style.display = 'none';
  if (!selectedNode) resetHighlight();
}

function onNodeClick(event, d) {
  event.stopPropagation();
  if (selectedNode === d) {
    selectedNode = null;
    resetHighlight();
  } else {
    selectedNode = d;
    highlightConnections(d);
  }
}

svg.on('click', () => {
  selectedNode = null;
  resetHighlight();
});

function getAllUpstream(nodeId, visited = new Set()) {
  if (visited.has(nodeId)) return visited;
  visited.add(nodeId);
  const n = nodeMap[nodeId];
  if (n) n.deps.forEach(depId => getAllUpstream(depId, visited));
  return visited;
}

function getAllDownstream(nodeId, visited = new Set()) {
  if (visited.has(nodeId)) return visited;
  visited.add(nodeId);
  const n = nodeMap[nodeId];
  if (n) n.dependents.forEach(depId => getAllDownstream(depId, visited));
  return visited;
}

function highlightConnections(d) {
  const upstream = getAllUpstream(d.id);
  const downstream = getAllDownstream(d.id);
  const connected = new Set([...upstream, ...downstream]);

  nodeElements
    .attr('opacity', n => connected.has(n.id) ? 1 : 0.08)
    .attr('r', n => n.id === d.id ? getRadius(n) * 1.6 : getRadius(n));

  labelElements
    .attr('opacity', n => connected.has(n.id) ? 1 : 0.08)
    .attr('font-size', n => {
      if (n.id === d.id) return 11;
      if (connected.has(n.id)) return 9;
      return 7;
    });

  linkElements
    .attr('opacity', l => {
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      return connected.has(sid) && connected.has(tid) ? 1 : 0.03;
    })
    .attr('stroke', l => {
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      return connected.has(sid) && connected.has(tid) ? '#f97316' : 'rgba(124,106,239,0.12)';
    })
    .attr('stroke-width', l => {
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      return connected.has(sid) && connected.has(tid) ? 2 : 1;
    })
    .attr('marker-end', l => {
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      return connected.has(sid) && connected.has(tid) ? 'url(#arrow-hl)' : 'url(#arrow)';
    });
}

function resetHighlight() {
  nodeElements.attr('opacity', 1).attr('r', d => getRadius(d));
  labelElements.attr('opacity', 1).attr('font-size', d => d.dependents.length > 3 ? 9 : 7);
  linkElements
    .attr('opacity', 1)
    .attr('stroke', 'rgba(124,106,239,0.12)')
    .attr('stroke-width', 1)
    .attr('marker-end', 'url(#arrow)');
}

function updateVisibility() {
  const visible = new Set();
  nodes.forEach(n => {
    const matchStatus = activeStatuses.has(n.status);
    const matchCat = activeCategories.has(n.category);
    const matchSearch = !searchTerm ||
      n.id.toLowerCase().includes(searchTerm) ||
      n.title.toLowerCase().includes(searchTerm);
    if (matchStatus && matchCat && matchSearch) visible.add(n.id);
  });

  nodeElements.attr('display', d => visible.has(d.id) ? null : 'none');
  labelElements.attr('display', d => visible.has(d.id) ? null : 'none');
  linkElements.attr('display', l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    return visible.has(sid) && visible.has(tid) ? null : 'none';
  });
}

function dragStarted(event, d) {
  if (!event.active) simulation.alphaTarget(0.1).restart();
  d.fx = d.x;
  d.fy = d.y;
}

function dragged(event, d) {
  d.fx = event.x;
  d.fy = event.y;
}

function dragEnded(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null;
  d.fy = null;
}

// Auto-zoom to fit after stabilization
setTimeout(() => {
  svg.transition().duration(800).call(
    zoom.transform,
    d3.zoomIdentity.translate(width/2, height/2).scale(0.45).translate(-width/2, -height/2)
  );
}, 2000);
</script>
</body>
</html>
