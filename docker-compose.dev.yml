services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1001}
        GID: ${GID:-1001}
    container_name: nomos-dev-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=file:/data/nomos.db
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=http://localhost:3001
      - CORS_ORIGIN=http://localhost:3000
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-5-20250929}
      - NOMOS_MOCK_AGENT=${NOMOS_MOCK_AGENT:-false}
      - ALLOWED_ROOT_DIRECTORY=/projects
      - DATA_DIR=/data
      - IS_CONTAINERIZED=true
    volumes:
      - .:/app:cached
      - nomos-dev-node-modules:/app/node_modules
      - ./apps/server/data:/data
      - ~/.claude:/home/nomos/.claude:ro
    entrypoint: /usr/local/bin/docker-entrypoint.sh
    command: >
      bash -c "bun install && exec gosu nomos bun run --hot apps/server/src/index.ts"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1001}
        GID: ${GID:-1001}
    container_name: nomos-dev-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - VITE_SERVER_URL=http://localhost:3001
    volumes:
      - .:/app:cached
      - nomos-dev-node-modules:/app/node_modules
    working_dir: /app/apps/web
    entrypoint: /usr/local/bin/docker-entrypoint.sh
    command: >
      bash -c "cd /app && bun install && cd /app/apps/web && exec gosu nomos bunx vite --host --port 3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nomos-dev-node-modules:
