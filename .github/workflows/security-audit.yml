name: Security Audit

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  # Secret scanning runs always (doesn't need scaffolding)
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  check-scaffold:
    name: Check Project State
    runs-on: ubuntu-latest
    outputs:
      scaffolded: ${{ steps.check.outputs.scaffolded }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check if project is scaffolded
        id: check
        run: |
          if [ -f "package.json" ]; then
            echo "scaffolded=true" >> $GITHUB_OUTPUT
          else
            echo "scaffolded=false" >> $GITHUB_OUTPUT
            echo "Project not yet scaffolded, skipping dependency audit"
          fi

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: check-scaffold
    if: needs.check-scaffold.outputs.scaffolded == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun audit
        run: bun pm audit

      - name: Check for known vulnerabilities
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  security-complete:
    name: Security Complete
    runs-on: ubuntu-latest
    needs: [secret-scan, check-scaffold, dependency-audit]
    if: always()
    steps:
      - name: Check results
        run: |
          # Secret scan must always pass
          if [ "${{ needs.secret-scan.result }}" == "failure" ]; then
            echo "❌ Secret scanning failed - secrets detected in codebase"
            exit 1
          fi

          # Dependency audit only checked if scaffolded
          if [ "${{ needs.check-scaffold.outputs.scaffolded }}" == "false" ]; then
            echo "✅ Secret scan passed"
            echo "⚠️  Dependency audit skipped - project not yet scaffolded"
            exit 0
          fi

          if [ "${{ needs.dependency-audit.result }}" == "failure" ]; then
            echo "❌ Dependency audit failed"
            exit 1
          fi

          echo "✅ All security checks passed"
