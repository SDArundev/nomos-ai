name: Security Audit

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  check-scaffold:
    name: Check Project State
    runs-on: ubuntu-latest
    outputs:
      scaffolded: ${{ steps.check.outputs.scaffolded }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if project is scaffolded
        id: check
        run: |
          if [ -f "package.json" ]; then
            echo "scaffolded=true" >> $GITHUB_OUTPUT
          else
            echo "scaffolded=false" >> $GITHUB_OUTPUT
            echo "Project not yet scaffolded, skipping security audit"
          fi

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: check-scaffold
    if: needs.check-scaffold.outputs.scaffolded == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun audit
        run: bun pm audit
        continue-on-error: true

      - name: Check for known vulnerabilities
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  audit-complete:
    name: Audit Complete
    runs-on: ubuntu-latest
    needs: [check-scaffold, audit]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.check-scaffold.outputs.scaffolded }}" == "false" ]; then
            echo "✅ Security audit skipped - project not yet scaffolded"
            exit 0
          fi

          if [ "${{ needs.audit.result }}" == "failure" ]; then
            echo "❌ Security audit failed"
            exit 1
          fi

          echo "✅ Security audit passed"
