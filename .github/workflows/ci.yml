name: CI

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-scaffold:
    name: Check Project State
    runs-on: ubuntu-latest
    outputs:
      scaffolded: ${{ steps.check.outputs.scaffolded }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if project is scaffolded
        id: check
        run: |
          if [ -f "package.json" ]; then
            echo "scaffolded=true" >> $GITHUB_OUTPUT
            echo "Project is scaffolded, running full CI"
          else
            echo "scaffolded=false" >> $GITHUB_OUTPUT
            echo "Project not yet scaffolded (no package.json), skipping CI jobs"
          fi

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: check-scaffold
    if: needs.check-scaffold.outputs.scaffolded == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          build-packages: 'false'

      - name: Check formatting and linting
        run: bun run check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: check-scaffold
    if: needs.check-scaffold.outputs.scaffolded == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run TypeScript check
        run: bun run check-types

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check-scaffold
    if: needs.check-scaffold.outputs.scaffolded == 'true'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nomos
          POSTGRES_PASSWORD: nomos
          POSTGRES_DB: nomos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Run migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgresql://nomos:nomos@localhost:5432/nomos_test

      - name: Run tests with coverage
        run: bun run test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://nomos:nomos@localhost:5432/nomos_test

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check-scaffold, lint, typecheck, test]
    if: needs.check-scaffold.outputs.scaffolded == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Build all packages
        run: bun run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [check-scaffold, build]
    if: needs.check-scaffold.outputs.scaffolded == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nomos-ai:ci --no-cache .

  # This job always runs and reports success when project is not scaffolded
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [check-scaffold, lint, typecheck, test, build, docker]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.check-scaffold.outputs.scaffolded }}" == "false" ]; then
            echo "✅ CI skipped - project not yet scaffolded (run /nomos F001 first)"
            exit 0
          fi

          if [ "${{ needs.lint.result }}" == "failure" ] || \
             [ "${{ needs.typecheck.result }}" == "failure" ] || \
             [ "${{ needs.test.result }}" == "failure" ] || \
             [ "${{ needs.build.result }}" == "failure" ] || \
             [ "${{ needs.docker.result }}" == "failure" ]; then
            echo "❌ CI failed"
            exit 1
          fi

          echo "✅ CI passed"
