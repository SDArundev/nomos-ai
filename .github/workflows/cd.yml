name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nomos
          POSTGRES_PASSWORD: nomos
          POSTGRES_DB: nomos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: resolve
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${GIT_SHA:0:7}"
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Run container and health check
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.tag }}
          FULL_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          docker run -d --name nomos-health-check \
            --network host \
            -e DATABASE_URL=postgresql://nomos:nomos@localhost:5432/nomos \
            -e BETTER_AUTH_SECRET=test-secret-that-is-at-least-32-chars-long \
            -e BETTER_AUTH_URL=http://localhost:3001 \
            -e CORS_ORIGIN=http://localhost:3001 \
            -e PORT=3001 \
            -e NODE_ENV=production \
            "${FULL_IMAGE}:${IMAGE_TAG}"

          # Wait for the container to start
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health; then
              echo ""
              echo "Health check passed!"
              exit 0
            fi
            echo "Waiting for container to be ready... ($i/30)"
            sleep 2
          done

          echo "Health check failed!"
          docker logs nomos-health-check
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f nomos-health-check || true
